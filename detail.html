            --accent: #F2994A;
            --accent-hover: #E0893A;
            --bg: #FFFFFF;
            --bg-light: #F8F5F2;
            --text-title: #2D3748;
            --text-body: #4A5568;
            --text-muted: #718096;
            --border: #EDE8E3;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
            --radius: 10px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;

            color: var(--text-body);
            line-height: 1.6;

        a { color: inherit; text-decoration: none; }

        /* ===== HEADER ===== */
        .header {

            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-top {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 20px 0 16px;
            flex-wrap: wrap;
        }
        .header-brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .header-brand h1 {
            font-weight: 800;
            font-size: 22px;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .header-brand .divider { color: var(--border); font-weight: 300; }
        .header-brand .zh-name { font-size: 18px; font-weight: 700; color: var(--text-title); }
        .header-period { font-size: 13px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
        .header-subtitle { width: 100%; font-size: 13px; color: var(--text-muted); font-weight: 400; }
        .header-nav {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .header-nav a {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .header-nav a:hover,
        .header-nav a.active { color: var(--primary); border-bottom-color: var(--accent); }
        .header-nav a:first-child { padding-left: 0; }

            margin: 0 auto;
            padding: 28px 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
        }

        .breadcrumb {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .breadcrumb a { color: var(--text-muted); transition: color 0.2s; }
        .breadcrumb a:hover { color: var(--accent); }
        .breadcrumb span { color: var(--text-muted); margin: 0 6px; }
        .breadcrumb .current { color: var(--text-body); font-weight: 500; }

        /* ===== ARTICLE ===== */
        .article { background: var(--bg); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

        .article-image {
            aspect-ratio: 16 / 7;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .article-image .image-icon { font-size: 80px; filter: drop-shadow(0 4px 16px rgba(0,0,0,0.15)); z-index: 1; }
        .article-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);

        .article-category {

            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 4px;
            color: var(--accent);
            background: #FEF3EA;
            margin-bottom: 14px;

            color: var(--text-title);
            line-height: 1.35;
            margin-bottom: 12px;
        }

            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: var(--text-muted);
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

            width: 18px;
            height: 18px;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #fff;
        }

        .article-content {
            font-size: 16px;
            line-height: 1.9;
            color: var(--text-body);
        }
        .article-content p {
            margin-bottom: 18px;
        }
        .article-content .highlight-box {
            background: var(--bg-light);
            border-left: 3px solid var(--accent);
            padding: 16px 20px;
            border-radius: 0 6px 6px 0;
            margin: 20px 0;
            font-size: 15px;
            color: var(--text-body);
        }
        .article-content .highlight-box strong { color: var(--primary); }

            border-top: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

            flex-wrap: wrap;
            gap: 8px;
        }

            font-size: 12px;
            padding: 4px 12px;
            border-radius: 4px;
            background: var(--bg-light);
            color: var(--text-muted);

            align-items: center;
            gap: 6px;

            background: var(--accent);
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;

            color: var(--text-muted);
            margin-top: 20px;
            transition: color 0.2s;

        .hot-list .rank.top3 { color: #F1C40F; }
        .hot-list .hot-title {

            font-weight: 500;
            color: var(--text-title);
            line-height: 1.4;
            flex: 1;
            display: -webkit-box;

            -webkit-box-orient: vertical;

            align-items: center;

        .source-sites .site-count { font-size: 12px; color: var(--text-muted); }
        .source-sites .site-logo {

            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;

            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 32px 20px;
            text-align: center;

            gap: 24px; margin-bottom: 12px; flex-wrap: wrap;

        .footer-links a:hover { color: var(--primary); }

        .footer .highlight { color: var(--primary); font-weight: 500; }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 640px) {
            .article-title { font-size: 30px; }
            .article-body { padding: 36px 32px 40px; }
            .article-image .image-icon { font-size: 96px; }
        }
        @media (min-width: 1024px) {
            .page { padding: 28px 24px; grid-template-columns: 1fr 300px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }

        /* ===== LOADING ===== */
        .status { text-align: center; padding: 80px 20px; display: none; }
        .status.visible { display: block; }
        .status .spinner {
            width: 36px; height: 36px;
            border: 3px solid #f0e6dc; border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status p { color: var(--text-muted); font-size: 15px; }
    </style>
</head>

        const params = new URLSearchParams(window.location.search);
        const articleId = parseInt(params.get('id')) || 1;

        // ===== RENDER ARTICLE =====
        function renderArticle(id) {
            const article = ARTICLE_DATA.news.find(n => n.id === id);
            const loading = document.getElementById('loadingStatus');
            const container = document.getElementById('articleContainer');

            if (!article) {
                loading.classList.remove('visible');
                container.style.display = 'block';
                container.innerHTML = `<div class="status"><p>文章不存在或已下架</p><a href="/" style="display:inline-block;margin-top:12px;color:var(--accent);">返回首页</a></div>`;
                return;
            }

            document.title = `${article.title} — Weekly Food Hot`;

            const logoLetter = article.source.charAt(0);
            const bodyHtml = article.content.map(p => `<p>${p}</p>`).join('');
            const tagsHtml = article.tags.map(t => `<span class="tag">${t}</span>`).join('');

            container.innerHTML = `
                <article class="article">
                    <div class="article-image" style="background:${article.imageColor}">
                        <span class="image-icon">${article.imageIcon}</span>
                    </div>
                    <div class="article-body">
                        <span class="article-category">${article.category}</span>
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-meta">
                            <span class="source-badge">
                                <span class="badge-logo" style="background:${article.sourceColor}">${logoLetter}</span>
                                ${article.source}
                            </span>
                            <span>📅 ${article.publishTime}</span>
                            <span>👁️ ${article.views}阅读</span>
                        </div>
                        <div class="article-content">
                            ${bodyHtml}
                        </div>
                        <div class="article-footer">
                            <div class="article-tags">${tagsHtml}</div>
                            <a href="${article.url}" class="original-link" target="_blank" rel="noopener">
                                阅读原文 →
                            </a>
                        </div>
                        <a href="/" class="back-link">← 返回首页</a>
                    </div>
                </article>
            `;

            loading.classList.remove('visible');
            container.style.display = 'block';
        }

        // ===== RENDER HOT =====
        function renderSidebar() {
            const sidebar = document.getElementById('sidebarContainer');
            const hotHtml = ARTICLE_DATA.hotTop5.map((item, i) => {
                const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                return `<li><span class="rank ${rankClass}">${String(i + 1).padStart(2, '0')}</span>
                    <div><div class="hot-title">${item.title}</div><div class="hot-views">${item.views}阅读</div></div></li>`;
            }).join('');
            const sourceHtml = ARTICLE_DATA.sourceSites.map(s =>
                `<li><div class="site-left"><span class="site-logo" style="background:${s.color}">${s.name.charAt(0)}</span>
                <span class="site-name">${s.name}</span></div><span class="site-count">${s.count}</span></li>`
            ).join('');

            sidebar.innerHTML = `
                <div class="sidebar-section">
                    <div class="section-title">🔥 本周热门 TOP5</div>
                    <ol class="hot-list">${hotHtml}</ol>
                </div>
                <div class="sidebar-section">
                    <div class="section-title">📡 热门来源站点</div>
                    <ul class="source-sites">${sourceHtml}</ul>
                </div>

                        <button>订阅</button>
                    </div>

        renderArticle(articleId);
