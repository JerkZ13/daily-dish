    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #5C3D2E;
            --accent: #F2994A;
            --accent-hover: #E0893A;
            --bg: #FFFFFF;
            --bg-light: #F8F5F2;
            --text-title: #2D3748;
            --text-body: #4A5568;
            --text-muted: #718096;
            --border: #EDE8E3;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-hover: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
            --radius: 10px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Helvetica Neue', sans-serif;
            background: var(--bg-light);
            color: var(--text-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }

        /* ===== HEADER ===== */
        .header {
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-top {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 20px 0 16px;
            flex-wrap: wrap;
        }
        .header-brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .header-brand h1 {
            font-weight: 800;
            font-size: 22px;
            color: var(--primary);
            letter-spacing: -0.5px;
        }
        .header-brand .divider {
            color: var(--border);
            font-weight: 300;
        }
        .header-brand .zh-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-title);
        }
        .header-period {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: auto;
            white-space: nowrap;
        }
        .header-subtitle {
            width: 100%;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .header-nav {
            display: flex;
            gap: 0;
            border-top: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .header-nav a {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }
        .header-nav a:hover,
        .header-nav a.active {
            color: var(--primary);
            border-bottom-color: var(--accent);
        }
        .header-nav a:first-child { padding-left: 0; }

        /* ===== CONTAINER ===== */
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }
        .filter-tags .tag {
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-light);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-family: inherit;
            white-space: nowrap;
        }
        .filter-tags .tag:hover { color: var(--accent); background: #FEF3EA; }
        .filter-tags .tag.active {
            color: #fff;
            background: var(--accent);
        }
        .filter-search {
            display: flex;
            align-items: center;
            min-width: 180px;
        }
        .filter-search input {
            width: 100%;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-body);
            background: var(--bg-light);
            outline: none;
            transition: border-color 0.2s;
        }
        .filter-search input:focus {
            border-color: var(--accent);
        }
        .filter-search input::placeholder {
            color: var(--text-muted);
        }

        /* ===== MAIN LAYOUT ===== */
        .main-area {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
        }

        /* ===== NEWS GRID (Masonry) ===== */
        .news-grid {
            column-count: 1;
            column-gap: 20px;
        }
        .news-card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: var(--bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        /* Source bar */
        .card-source-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
        }
        .card-source-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .source-logo {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .source-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-title);
        }
        .card-source-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }
        .card-source-right .views::before {
            content: '·';
            margin-right: 10px;
        }

        /* Card image */
        .card-image {
            position: relative;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-image .image-icon {
            font-size: 48px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
            transition: transform 0.4s ease;
            z-index: 1;
        }
        .news-card:hover .image-icon {
            transform: scale(1.15);
        }
        .card-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
        }

        /* Card body */
        .card-body {
            padding: 16px;
        }
        .card-body .card-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-title);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-body .card-summary {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 8px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-body .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .card-body .card-tag {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 4px;
            color: var(--accent);
            background: #FEF3EA;
        }
        .card-body .card-link {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            transition: color 0.2s;
        }
        .card-body .card-link:hover { color: var(--accent-hover); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar-section {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .sidebar-section .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Hot TOP5 */
        .hot-list { list-style: none; }
        .hot-list li {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            align-items: flex-start;
        }
        .hot-list li:last-child { border-bottom: none; padding-bottom: 0; }
        .hot-list .rank {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            min-width: 20px;
            font-feature-settings: "tnum";
        }
        .hot-list .rank.top1 { color: #E74C3C; }
        .hot-list .rank.top2 { color: var(--accent); }
        .hot-list .rank.top3 { color: #F1C40F; }
        .hot-list .hot-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-title);
            line-height: 1.4;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hot-list .hot-views {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            margin-top: 2px;
        }

        /* Source Sites */
        .source-sites { list-style: none; }
        .source-sites li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .source-sites li:last-child { border-bottom: none; padding-bottom: 0; }
        .source-sites .site-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .source-sites .site-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-title);
        }
        .source-sites .site-count {
            font-size: 12px;
            color: var(--text-muted);
        }
        .source-sites .site-logo {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        /* Subscribe */
        .subscribe p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .subscribe-form {
            display: flex;
            gap: 8px;
        }
        .subscribe-form input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            color: var(--text-body);
        }
        .subscribe-form input:focus {
            border-color: var(--accent);
        }
        .subscribe-form button {
            padding: 9px 18px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .subscribe-form button:hover { background: var(--accent-hover); }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--bg);
            border-top: 1px solid var(--border);
            padding: 32px 20px;
            text-align: center;
        }
        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .footer-links a {
            font-size: 13px;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--primary); }
        .footer p {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.8;
        }
        .footer .highlight { color: var(--primary); font-weight: 500; }

        /* ===== RESPONSIVE ===== */
        @media (min-width: 640px) {
            .news-grid { column-count: 2; }
            .header-brand h1 { font-size: 24px; }
        }

        @media (min-width: 1024px) {
            .page { padding: 28px 24px; }
            .main-area {
                grid-template-columns: 1fr 300px;
            }
            .news-grid { column-count: 2; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }
    </style>
</head>

                    source: '成都发布',
                    sourceColor: '#E67E22',
                    publishTime: '2026-05-03',
                    views: '11.2万',
                    imageColor: 'linear-gradient(135deg, #27AE60, #1E8449)',
                    imageIcon: '🌶️',
                    url: '#'
                },
                {
                    id: 9,
                    title: '米其林2026上海榜单发布，3家新餐厅摘星',
                    summary: '本年度上海米其林指南新增3家一星餐厅，其中一家素食餐厅引发广泛关注，标志着高端素食的崛起。',
                    category: '行业趋势',
                    source: '名厨',
                    sourceColor: '#2C3E50',
                    publishTime: '2026-05-02',
                    views: '9.6万',
                    imageColor: 'linear-gradient(135deg, #4A5568, #2D3748)',
                    imageIcon: '⭐',
                    url: '#'
                }
            ],
            hotTop5: [
                { title: '上海隐藏版居酒屋预约排到六月', views: '18.9万' },
                { title: '2026夏季奶茶新品盘点', views: '23.5万' },
                { title: '粽子口味大比拼 南北之争再起', views: '15.2万' },
                { title: '北京胡同Brunch店打卡测评', views: '12.7万' },
                { title: '轻食市场年增长42%', views: '9.8万' }
            ],
            sourceSites: [
                { name: '小红书', color: '#FF6B6B', count: '32篇' },
                { name: '大众点评', color: '#E74C3C', count: '28篇' },
                { name: '抖音美食', color: '#1E1E1E', count: '24篇' },
                { name: '美食天下', color: '#27AE60', count: '19篇' },
                { name: '餐饮老板内参', color: '#3498DB', count: '15篇' },
                { name: '名厨', color: '#2C3E50', count: '12篇' }
            ]
        };


        let NEWS_DATA = DEMO_DATA.news || [];
        let activeCategory = 'all';
        let searchQuery = '';
        let isLoading = false;

        // ===== LOAD FROM API =====
        async function loadFromAPI() {
            try {
                const res = await fetch(API_URL, { signal: AbortSignal.timeout(8000) });
                if (!res.ok) throw new Error('API error');
                const data = await res.json();
                if (data.news && data.news.length > 0) {
                    NEWS_DATA = data.news;
                    if (data.hotTop5) renderHot(data.hotTop5);
                    if (data.sourceSites) renderSources(data.sourceSites);
                    return true;
                }
                return false;
            } catch {
                return false;
            }
        }

        // ===== INIT =====
        async function init() {
            const loaded = await loadFromAPI();
            if (!loaded) {
                NEWS_DATA = DEMO_DATA.news;
            }
            filterNews();
            renderHot(DEMO_DATA.hotTop5);
            renderSources(DEMO_DATA.sourceSites);
        }

        // ===== RENDER NEWS =====
        function renderNews(data) {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';
            data.forEach((item, idx) => {
                const card = document.createElement('article');
                card.className = 'news-card';
                card.style.cursor = 'pointer';
                const id = item.id || (idx + 1);
                const logoLetter = item.source.charAt(0);
                card.innerHTML = `
                    <div class="card-source-bar">
                        <div class="card-source-left">
                            <span class="source-logo" style="background:${item.sourceColor}">${logoLetter}</span>
                            <span class="source-name">${item.source}</span>
                        </div>
                        <div class="card-source-right">
                            <span>${item.publishTime}</span>
                            <span class="views">${item.views}阅读</span>
                        </div>
                    </div>
                    <div class="card-image" style="background:${item.imageColor};position:relative;overflow:hidden">
                        ${item.imageUrl ? `<img src="${item.imageUrl}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display='none'">` : ''}
                        <span class="image-icon" style="position:relative;z-index:1">${item.imageIcon}</span>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-summary">${item.summary}</p>
                        <div class="card-actions">
                            <span class="card-tag">${item.category}</span>
                            <span class="card-link" style="cursor:pointer">阅读全文 →</span>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => { window.location.href = 'detail.html?id=' + id; });
                grid.appendChild(card);
            });
        }

        // ===== RENDER HOT =====
        function renderHot(items) {
            const data = items || DEMO_DATA.hotTop5 || [];
            const list = document.getElementById('hotList');
            list.innerHTML = '';
            data.forEach((item, i) => {
                const li = document.createElement('li');
                const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
                li.innerHTML = `
                    <span class="rank ${rankClass}">${String(i + 1).padStart(2, '0')}</span>
                    <div>
                        <div class="hot-title">${item.title}</div>
                        <div class="hot-views">${item.views}阅读</div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        // ===== RENDER SOURCES =====
        function renderSources(items) {
            const data = items || DEMO_DATA.sourceSites || [];
            const list = document.getElementById('sourceSites');
            list.innerHTML = '';
            data.forEach(site => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="site-left">
                        <span class="site-logo" style="background:${site.color}">${site.name.charAt(0)}</span>
                        <span class="site-name">${site.name}</span>
                    </div>
                    <span class="site-count">${site.count}</span>
                `;
                list.appendChild(li);
            });
        }

        // ===== FILTER =====
        function filterNews() {
            let filtered = NEWS_DATA;
            if (activeCategory !== 'all') {
                filtered = filtered.filter(n => n.category === activeCategory);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(n =>
                    n.title.toLowerCase().includes(q) ||
                    n.summary.toLowerCase().includes(q) ||
                    n.source.toLowerCase().includes(q)
                );
            }
            renderNews(filtered);
        }

        // ===== FILTER TAGS =====
        document.getElementById('filterTags').addEventListener('click', e => {
            const btn = e.target.closest('.tag');
            if (!btn) return;
            document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            activeCategory = btn.dataset.cat;
            filterNews();
        });

        // ===== SEARCH =====
        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', e => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = e.target.value;
                filterNews();
            }, 300);
        });

        // ===== INIT =====
        init();
    </script>
</body>
</html>
